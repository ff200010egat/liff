<script>
const ENDPOINT = "https://script.google.com/macros/s/AKfycbz-ylxt036LLWmv_SIFAYQ7Ew2GXVq1cXLXy34qkVJ-plhgYyeDrLr4yCAgL4iVFH7QgA/exec";
let userId = "", role = "", mobile = "", displayName = "";
let driverListCache = [];
let currentBookingIdToAssign = null;
// [ADDED] Global variables for Series feature

// [OPTIMIZATION] Cache variable

function toggleLoad(s, status) {
  const el = document.getElementById("loading");
  if (s) { el.classList.add("active"); }
  else { el.classList.remove("active"); setLoadStatus(""); }
  if (status !== undefined) setLoadStatus(status);
}
function setLoadStatus(msg) {
  const el = document.getElementById("loadingStatus");
  if (el) el.innerText = msg || "";
}

// =========================================================
// [FIXED] Safe JSON Helper — กัน HTML response จาก GAS
// =========================================================
async function safeJson(response) {
  const text = await response.text();
  try {
    return JSON.parse(text);
  } catch(e) {
    console.error("GAS returned non-JSON:", text.substring(0, 300));
    throw new Error(
      "ระบบได้รับข้อมูลผิดรูปแบบ (ไม่ใช่ JSON)\n" +
      "กรุณารีเฟรชหน้าเว็บ หรือแจ้ง Admin"
    );
  }
}

// =========================================================
// [FIXED] gasPost — ส่ง request แบบ Simple Request (text/plain)
// เพื่อหลีกเลี่ยง CORS preflight ที่ทำให้ GAS redirect บน PC Browser
// มือถือ (LINE WebView) ใช้งานได้ทั้ง 2 แบบ แต่ PC Browser ต้องใช้ text/plain
// =========================================================
function gasPost(payload) {
  return fetch(ENDPOINT, {
    method: "POST",
    body: JSON.stringify(payload),
    headers: { "Content-Type": "text/plain" }
  }).then(r => safeJson(r));
}

// [OPTIMIZATION #1] localStorage Cache Helper
const Cache = {
  get: function(key) {
    try {
      const item = localStorage.getItem(key);
      if (!item) return null;
      const data = JSON.parse(item);
      if (Date.now() > data.expires) {
        localStorage.removeItem(key);
        return null;
      }
      return data.value;
    } catch(e) { return null; }
  },
  set: function(key, value, ttlMinutes) {
    ttlMinutes = ttlMinutes || 60;
    try {
      const data = {
        value: value,
        expires: Date.now() + (ttlMinutes * 60 * 1000)
      };
      localStorage.setItem(key, JSON.stringify(data));
    } catch(e) { console.error("Cache set error:", e); }
  },
  remove: function(key) {
    try { localStorage.removeItem(key); } catch(e) {}
  }
};

function formatThaiDateTime(dateVal, timeVal) {
  if (!dateVal) return "-";
  const d = new Date(dateVal);
  const months = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];
  const dateStr = `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear() + 543}`;
  let timeStr = String(timeVal).includes("T") ? new 
  Date(timeVal).getHours().toString().padStart(2,'0')+":"+new Date(timeVal).getMinutes().toString().padStart(2,'0') : String(timeVal).substring(0,5);
  return dateStr + " | " + timeStr + " น.";
}

// [ADDED] คำนวณและแสดงวันสุดท้ายของงาน สำหรับงานที่ duration >= 24 ชม.
function formatEndDate(dateVal, timeVal, durationVal) {
  const dur = parseFloat(durationVal) || 0;
  if (dur < 24) return ""; // ไม่เกิน 1 วัน → ไม่แสดง
  const dateStr = String(dateVal).substring(0, 10);
  let timeStr = "";
  if (String(timeVal).includes("T")) {
    const t = new Date(timeVal);
    timeStr = t.getHours().toString().padStart(2,'0') + ":" + t.getMinutes().toString().padStart(2,'0');
  } else {
    timeStr = String(timeVal).substring(0, 5);
  }
  const start = new Date(dateStr + "T" + timeStr + ":00");
  const end = new Date(start.getTime() + (dur * 60 * 60 * 1000));
  const months = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];
  return ` ถึง ${end.getDate()} ${months[end.getMonth()]} ${end.getFullYear() + 543}`;
}

async function init() {
  toggleLoad(true, "กำลังเชื่อมต่อ LINE...");
  try {
    await liff.init({ liffId: "2008934745-qU0fPztf" });
    if (!liff.isLoggedIn()) {
      liff.login();
      return; // Stop here, will reload after login
    }

    setLoadStatus("ดึงข้อมูลโปรไฟล์...");
    const p = await liff.getProfile();
    userId = p.userId;
    displayName = p.displayName;

    document.getElementById("username").innerText = displayName;
    if (p.pictureUrl) {
      const pImg = document.getElementById("profileImg");
      pImg.src = p.pictureUrl;
      pImg.style.display = "block";
    }

    // [OPTIMIZATION #1] Try cache first
    const cacheKey = `user_${userId}`;
    const cached = Cache.get(cacheKey);

    if (cached) {
      role = cached.role;
      mobile = cached.mobile;
      renderUI();
      initFlatpickr();

      const cachedBookings = Cache.get(`bookings_${userId}`);
      if (cachedBookings) {
        cachedBookingsData = cachedBookings;
        setLoadStatus("แสดงข้อมูลจาก cache...");
        showHistory(true);
      }
    }

    // [OPTIMIZATION #3] Parallel fetch — ใช้ gasPost แทน fetch โดยตรง
    setLoadStatus("โหลดข้อมูลงานจากเซิร์ฟเวอร์...");
    try {
      const [userRes, bookingsRes] = await Promise.all([
        gasPost({ action: "auto_register", line_user_id: userId, display_name: displayName }),
        gasPost({ action: "get_all_bookings", line_user_id: userId })
      ]);

      role = userRes.role;
      mobile = userRes.mobile;
      Cache.set(cacheKey, { role, mobile }, 60);

      if (!cached) {
        renderUI();
        initFlatpickr();
      } else if (cached.role !== role) {
        renderUI();
      }

      setLoadStatus("แสดงรายการจอง...");
      cachedBookingsData = bookingsRes;
      Cache.set(`bookings_${userId}`, bookingsRes, 5);
      showHistory(false);
      
    } catch (fetchErr) {
      console.error("Fetch error:", fetchErr);
      if (!cached) {
        setLoadStatus("ลองโหลดใหม่อีกครั้ง...");
        const userRes = await gasPost({ action: "auto_register", line_user_id: userId, display_name: displayName });
        role = userRes.role;
        mobile = userRes.mobile;
        renderUI();
        initFlatpickr();
        setLoadStatus("โหลดรายการจอง...");
        await showHistory(false);
      }
    }
    
  } catch (err) { 
    console.error("Init error:", err);
    alert("เกิดข้อผิดพลาด: " + err.message + "\n\nกรุณารีเฟรชหน้าเว็บ"); 
    toggleLoad(false);
  }
}

// [ADDED] Flatpickr Initialization and Toggle
function initFlatpickr() {
  const cfg = {
    dateFormat: "Y-m-d",
    minDate: "today",
    disableMobile: "true",
    onChange: function(selectedDates, dateStr, instance) {
       if(isSeriesMode) {
          document.getElementById("selectedDatesList").innerText = `เลือกแล้ว ${selectedDates.length} วัน: ` + selectedDates.map(d => d.getDate()+"/"+(d.getMonth()+1)).join(", ");
       } else {
          document.getElementById("selectedDatesList").innerText = "";
       }
    }
  };
  fpInstance = flatpickr("#booking_date", cfg);
}

function toggleBookingMode() {
  isSeriesMode = !isSeriesMode;
  const btn = document.getElementById("modeToggle");
  const label = document.getElementById("modeLabel");
  
  if (isSeriesMode) {
     btn.innerHTML = "🔄 โหมด: <b>จองเป็นชุด (Series)</b>";
     btn.style.background = "#fff3cd"; // Yellowish
     btn.style.color = "#856404";
     btn.style.borderColor = "#ffeeba";
     label.innerText = "(เลือกได้หลายวัน - ภายในเดือนเดียวกัน)";
     // Re-init Flatpickr as multiple with month restriction
     fpInstance.destroy();
     fpInstance = flatpickr("#booking_date", { 
        mode: "multiple", 
        dateFormat: "Y-m-d", 
        minDate: "today", 
        disableMobile: "true",
        onChange: function(selectedDates) {
          document.getElementById("selectedDatesList").innerText = `เลือกแล้ว ${selectedDates.length} วัน: ` + selectedDates.map(d => d.getDate()+"/"+(d.getMonth()+1)).join(", ");
        },
        // [ADDED] จำกัดให้เลือกได้เฉพาะเดือนเดียวกัน
        enable: [
          function(date) {
            // ถ้ายังไม่มีวันที่เลือก → เลือกได้ทุกวัน (หลัง today)
            const selected = fpInstance.selectedDates;
            if (selected.length === 0) return true;
            
            // ถ้ามีวันที่เลือกแล้ว → เลือกได้เฉพาะเดือนเดียวกับวันแรก
            const firstDate = selected[0];
            return date.getMonth() === firstDate.getMonth() && 
                   date.getFullYear() === firstDate.getFullYear();
          }
        ],
        onMonthChange: function(selectedDates, dateStr, instance) {
          // ถ้ามีวันที่เลือกแล้ว → กลับไปเดือนเดิม
          if (selectedDates.length > 0) {
            const firstDate = selectedDates[0];
            instance.changeMonth(firstDate.getMonth() - instance.currentMonth, false);
            instance.changeYear(firstDate.getFullYear() - instance.currentYear);
          }
        }
     });
  } else {
     btn.innerHTML = "🔄 โหมด: <b>จองครั้งเดียว</b>";
     btn.style.background = "#e3f2fd"; // Blueish
     btn.style.color = "#0a7cff";
     btn.style.borderColor = "#0a7cff";
     label.innerText = "(เลือก 1 วัน)";
     document.getElementById("selectedDatesList").innerText = "";
     // Re-init Flatpickr as single
     fpInstance.destroy();
     fpInstance = flatpickr("#booking_date", { mode: "single", dateFormat: "Y-m-d", minDate: "today", disableMobile: "true" });
  }
}

// [MODIFIED] Update showHistory to support Grouping
// [OPTIMIZATION #2] Lazy Load History with cache
async function showHistory(useCache) {
  useCache = useCache || false;
  const hBox = document.getElementById("historyBox");
  
  let res;
  if (useCache && cachedBookingsData) {
    res = cachedBookingsData;
  } else {
    if (!useCache) toggleLoad(true, "โหลดรายการจองล่าสุด...");
    res = await gasPost({ action: "get_all_bookings", line_user_id: userId });
    cachedBookingsData = res;
    Cache.set(`bookings_${userId}`, res, 5);
  }
  
  const nowDay = new Date().setHours(0,0,0,0);
  let filtered = (res.data || []).filter(b => {
    if (role === "admin") return true;
    if (role === "driver") return (b.booked_by === userId || b.driver_line_id === userId || b.status === "pending");
    return (b.booked_by === userId);
  });
  // แยกรายการ 3 กลุ่ม (ปรับปรุงใหม่):
  // 1. upcomingList = งาน Active (ไม่ Cancel) ที่วัน >= วันนี้
  // 2. pastList = งาน Active (ไม่ Cancel) ที่วัน < วันนี้ และ Status != pending
  // 3. failedList = งาน Active ที่วัน < วันนี้ และ Status == pending (งานไม่สำเร็จ)
  // 4. cancelledList = งาน Cancel
   
  let allNonCancelled = filtered.filter(b => b.status !== "cancelled");
  let cancelledList = filtered.filter(b => b.status === "cancelled");

  let upcomingList = allNonCancelled.filter(b => new Date(b.booking_date).setHours(0,0,0,0) >= nowDay);
  // *** แก้ไข: แยก pending ที่เป็นอดีตไปอยู่ failedList ***
  let pastList = allNonCancelled.filter(b => new Date(b.booking_date).setHours(0,0,0,0) < nowDay && b.status !== 'pending');
  let failedList = allNonCancelled.filter(b => new Date(b.booking_date).setHours(0,0,0,0) < nowDay && b.status === 'pending');
  // เรียงลำดับวันที่ (จากใกล้ไปไกล) ทุกกลุ่ม
  const sortFunc = (a, b) => new Date(a.booking_date) - new Date(b.booking_date) ||
  (a.booking_time > b.booking_time ? 1 : -1);
   
  upcomingList.sort(sortFunc);
  pastList.sort(sortFunc);
  failedList.sort(sortFunc);
  cancelledList.sort(sortFunc);

  // [ADDED] Render Logic with Grouping
  const renderList = (list) => {
    // Grouping by batch_id
    let grouped = {};
    let singles = [];
    
    list.forEach(b => {
      if(b.batch_id) {
        if(!grouped[b.batch_id]) grouped[b.batch_id] = [];
        grouped[b.batch_id].push(b);
      } else {
        singles.push(b);
      }
    });

    let mixedList = [...singles];
    Object.keys(grouped).forEach(k => {
      mixedList.push({ isSeries: true, items: grouped[k], sortDate: grouped[k][0].booking_date, batch_id: k });
    });
    
    // Sort mixed list by date
    mixedList.sort((a, b) => {
      let dA = a.isSeries ? new Date(a.sortDate) : new Date(a.booking_date);
      let dB = b.isSeries ? new Date(b.sortDate) : new Date(b.booking_date);
      return dA - dB;
    });

    if (mixedList.length === 0) return "";
    return mixedList.map(item => item.isSeries ? renderSeriesCard(item) : renderCard(item)).join("");
  };

  // 1. ส่วนรายการงานปัจจุบัน/อนาคต
  let html = "<h3 style='margin: 20px 0 10px 0;'>รายการงาน (เร็วๆ นี้)</h3>";
  if(upcomingList.length === 0) html += "<p style='color:#777;'>ไม่มีรายการงานที่กำลังจะมาถึง</p>";
  else html += renderList(upcomingList);
  // 1.5 ส่วนรายการงานไม่สำเร็จ (New)
  if(failedList.length > 0) {
    html += `
      <div style="margin-top:25px; border-top: 1px dashed #ccc; padding-top:15px;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h3 style="margin:0; color:#d9534f;">งานไม่สำเร็จ (หมดอายุ)</h3>
            <button class="secondary" style="width:auto; padding:8px 15px; font-size:14px; margin:0;"
            onclick="loadFailedJobs()">
                ⚠️ ดูรายละเอียด (${failedList.length})
            </button>
        </div>
        <div id="failedArea" style="display:none; margin-top:15px;"></div>
      </div>
    `;
  }

  // 2. ส่วนประวัติงานที่สำเร็จ (Toggle)
  if(pastList.length > 0) {
    html += `
      <div style="margin-top:25px; border-top: 1px dashed #ccc; padding-top:15px;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h3 style="margin:0; color:#666;">ประวัติงานที่สำเร็จ</h3>
            <button class="secondary" style="width:auto; padding:8px 15px; font-size:14px; margin:0;"
            onclick="loadPastJobs()">
                📜 ดูรายละเอียด (${pastList.length})
            </button>
        </div>
        <div id="pastArea" style="display:none; margin-top:15px;"></div>
      </div>
    `;
  }

  // 3. ส่วนรายการยกเลิก (Toggle)
  if(cancelledList.length > 0) {
    html += `
      <div style="margin-top:25px; border-top: 1px dashed #ccc; padding-top:15px;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h3 style="margin:0; color:#666;">รายการที่ถูกยกเลิก</h3>
            <button class="secondary" style="width:auto; padding:8px 15px; font-size:14px; margin:0;"
            onclick="loadCancelledJobs()">
                👁️ ดูรายละเอียด (${cancelledList.length})
            </button>
        </div>
        <div id="cancelledArea" style="display:none; margin-top:15px;"></div>
      </div>
    `;
  }

  hBox.innerHTML = html;
  toggleLoad(false);
  
  // [OPTIMIZATION #2] Store for lazy loading
  window.cachedLists = {
    failed: failedList,
    past: pastList,
    cancelled: cancelledList,
    renderList: renderList
  };
}

// ฟังก์ชันย่อยสำหรับ Render Card (Single)
const renderCard = (b, hideEdit = false) => {
    const nowDay = new Date().setHours(0,0,0,0);
    const isPast = new Date(b.booking_date).setHours(0,0,0,0) < nowDay;
    const isCancelled = b.status === "cancelled";
    let statusColor = (b.status === "pending") ? "#f39c12" : (isCancelled ? "#d9534f" : "#28a745");
    let ackBtn = "";
    if (role === "driver" && b.driver_line_id === userId && b.status === "confirmed") {
        ackBtn = `<button class="warning" onclick="acknowledgeJob('${b.booking_id}')">👌 รับทราบงานนี้แล้ว</button>`;
    }

    let adminAssignBtn = "";
    if (role === "admin" && !isCancelled) {
        adminAssignBtn = `<button class="primary" style="background:#17a2b8; margin-bottom:8px;"
        onclick="openAssignModal('${b.booking_id}')">👤 มอบหมายงาน (Admin)</button>`;
    }

    // [ADDED] Edit button — แสดงเฉพาะ admin (ทุกงาน) หรือ user (งานตัวเอง) ที่ยังไม่ cancel
    const canEdit = !hideEdit && !isCancelled && (role === "admin" || (role !== "driver" && b.booked_by === userId));
const editBtn = canEdit
      ? `<span onclick="openEditModal('${b.booking_id}')" title="แก้ไขงาน" style="cursor:pointer; font-size:16px; margin-right:5px; vertical-align:middle;">✏️</span>`
      : "";

    return `
      <div class="card ${ (isPast || isCancelled) ? 'past-job' : '' }">
        <div class="val-text">${editBtn}<b>${b.pickup_location} ➡️ ${b.dropoff_location}</b></div>
        <div class="val-text">📅 ${formatThaiDateTime(b.booking_date, b.booking_time)}${formatEndDate(b.booking_date, b.booking_time, b.duration)}</div>
        <div class="val-text">👤 จองโดย: ${b.user_display_name} |
        🚗 ${b.vehicle_type}</div>
        <div class="val-text">สถานะ: <span style="font-weight:bold; color:${statusColor}">${b.status.toUpperCase()} ${b.driver_name ?
        '('+b.driver_name+')' : ''}</span></div>
        ${(role === "driver" && b.status === "pending" && !isPast) ?
        `<button class="success" onclick="acceptJob('${b.booking_id}')">✅ รับงานนี้</button>` : ""}
        ${ackBtn}
         
        <div style="display:flex; gap:5px;">
           <div style="width:100%">${adminAssignBtn}</div>
        </div>

        ${((b.booked_by === userId || b.driver_line_id === userId || role === "admin") && !isCancelled) ?
        `<button class="danger" onclick="cancelBooking('${b.booking_id}')">❌ ยกเลิกงานนี้</button>` : ""}
      </div>
    `;
};

// [ADDED] Render Series Card
const renderSeriesCard = (group) => {
    const items = group.items;
    const total = items.length;
    const pendingCount = items.filter(i => i.status === 'pending').length;
    const confirmedCount = items.filter(i => i.status === 'confirmed').length;
    
    // Check if Driver can accept ALL (must have some pending, and user is driver)
    const canAcceptAll = (role === "driver" && pendingCount > 0);

    // [ADDED] canEditSeries: admin แก้ได้ทุก series, user แก้ได้เฉพาะ series ของตัวเอง, driver ไม่มีสิทธิ
    const firstItem = items[0];
    const hasAnyCancelled = items.every(i => i.status === 'cancelled');
    const canEditSeries = !hasAnyCancelled && (role === "admin" || (role !== "driver" && firstItem.booked_by === userId));
    const seriesEditBtn = canEditSeries
      ? `<span onclick="openEditSeriesModal('${group.batch_id}')" title="แก้ไขงานทั้งชุด" style="cursor:pointer; font-size:16px; margin-right:6px; vertical-align:middle;">✏️</span>`
      : "";
    
    // Generate sub-cards
    const subCards = items.map(item => renderCard(item, true)).join("");
    
    // สร้างรายการวันที่ทั้งหมด (เรียงตามวันที่)
    const sortedItems = [...items].sort((a, b) => new Date(a.booking_date) - new Date(b.booking_date));
    
    const dateList = sortedItems.map(item => {
        const d = new Date(item.booking_date);
        const months = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];
        return `${d.getDate()} ${months[d.getMonth()]}`;
    }).join(" / ");
    
    // ใช้ข้อมูลจากงานแรก (เวลาและเส้นทางควรเหมือนกันทั้งหมด)
    const firstSortedItem = sortedItems[0];
    const timeStr = String(firstSortedItem.booking_time).includes("T") 
        ? new Date(firstSortedItem.booking_time).getHours().toString().padStart(2,'0')+":"+new Date(firstSortedItem.booking_time).getMinutes().toString().padStart(2,'0')
        : String(firstSortedItem.booking_time).substring(0,5);
    
    return `
      <div class="card series-card">
         <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
            <b style="font-size:16px;">${seriesEditBtn}📦 งานเป็นชุด (${total} งาน)</b>
            <span style="font-size:13px;">
               <span style="color:#28a745; font-weight:bold;">✅ ${confirmedCount}</span> | 
               <span style="color:#f39c12; font-weight:bold;">⏳ ${pendingCount}</span>
            </span>
         </div>
         
         <div style="margin-bottom:8px;">
            <div class="val-text" style="font-size:14px; color:#555; margin-bottom:4px;">
               วันที่ ${dateList}
            </div>
            <div class="val-text" style="font-size:14px;">
               | ${timeStr} น.  📍 <b>${firstSortedItem.pickup_location} ➡️ ${firstSortedItem.dropoff_location}</b>
            </div>
         </div>
         
         ${canAcceptAll ? `<button class="success" style="margin-bottom:8px;" onclick="acceptSeries('${group.batch_id}')">✅✅ รับงานทั้งหมด (${pendingCount} วัน)</button>` : ''}
         <button class="secondary" onclick="document.getElementById('series_${group.batch_id}').style.display = (document.getElementById('series_${group.batch_id}').style.display=='none'?'block':'none')">
            📜 กดดูรายละเอียด / ซ่อน
         </button>
         <div id="series_${group.batch_id}" style="display:none; margin-top:10px; border-top:1px dashed #ccc; padding-top:10px;">
            ${subCards}
         </div>
      </div>
    `;
};

// [FIXED FINAL] confirmAssign — ใช้ pattern เดียวกับ acceptJob ที่ทำงานได้ปกติ
async function confirmAssign() {
    const drvId = document.getElementById("modal_driver_select").value;
    if(!drvId) return alert("กรุณาเลือกคนขับที่ต้องการมอบหมาย");

    const selectElem = document.getElementById("modal_driver_select");
    const drvName = selectElem.options[selectElem.selectedIndex].text;
    const bookingIdToSend = currentBookingIdToAssign;

    closeAssignModal();

    if(!confirm(`ทบทวนรายการ:\nมอบหมายงานให้: ${drvName}\nยืนยันหรือไม่?`)) return;

    toggleLoad(true);
    try {
        await gasPost({ action: "assign_driver", booking_id: bookingIdToSend, assign_driver_id: drvId });
        alert("มอบหมายงานเรียบร้อย");
        await showHistory();
    } catch(err) {
        alert("เกิดข้อผิดพลาด: " + err.message);
        toggleLoad(false);
    }
}

// [ADDED] Edit Modal Functions (Single booking)
function openEditModal(id) {
  const b = (cachedBookingsData && cachedBookingsData.data || []).find(b => b.booking_id === id);
  if (!b) return alert("ไม่พบข้อมูลงาน");
  currentEditBooking = b;
  currentEditBatchId = null; // ไม่ใช่ series

  // --- แสดง/ซ่อน ส่วนที่เกี่ยวกับ Series ---
  document.getElementById("edit_series_info_row").style.display = "none";
  document.getElementById("edit_date_row").style.display = "block";

  // --- Populate fields ---
  let timeStr = "";
  if (String(b.booking_time).includes("T")) {
    const t = new Date(b.booking_time);
    timeStr = t.getHours().toString().padStart(2,'0') + ":" + t.getMinutes().toString().padStart(2,'0');
  } else {
    timeStr = String(b.booking_time).substring(0, 5);
  }
  document.getElementById("edit_booking_time").value = timeStr;
  document.getElementById("edit_vehicle_type").value = b.vehicle_type || "ไม่ระบุ";
  document.getElementById("edit_passenger_count").value = b.passenger_count || "";
  document.getElementById("edit_pickup_location").value = b.pickup_location || "";
  document.getElementById("edit_dropoff_location").value = b.dropoff_location || "";
  document.getElementById("edit_remark").value = b.remark || "";
  document.getElementById("edit_contact_mobile").value = b.contact_mobile || "";
  document.getElementById("edit_duration").value = String(b.duration || "1");

  const dateStr = String(b.booking_date).substring(0, 10);
  if (fpEditInstance) { fpEditInstance.destroy(); fpEditInstance = null; }
  fpEditInstance = flatpickr("#edit_booking_date", {
    dateFormat: "Y-m-d",
    defaultDate: dateStr,
    disableMobile: "true"
  });

  document.getElementById("editModal").style.display = "flex";
}

// [ADDED] openEditSeriesModal — เปิด modal แก้ไขทั้ง series
function openEditSeriesModal(batchId) {
  const allItems = (cachedBookingsData && cachedBookingsData.data || []).filter(b => b.batch_id === batchId);
  if (!allItems || allItems.length === 0) return alert("ไม่พบข้อมูลงานชุดนี้");
  currentEditBatchId = batchId;
  currentEditBooking = null; // ไม่ใช่งานเดี่ยว

  // ใช้ข้อมูลจากงานแรก (เวลา/เส้นทาง/รถ เหมือนกันทั้ง series)
  const b = allItems[0];

  // --- แสดง/ซ่อน ส่วนที่เกี่ยวกับ Series ---
  document.getElementById("edit_series_info_row").style.display = "block";
  document.getElementById("edit_series_count").innerText = allItems.length;
  document.getElementById("edit_date_row").style.display = "none"; // ซ่อนช่องวันที่

  // --- Populate fields ---
  let timeStr = "";
  if (String(b.booking_time).includes("T")) {
    const t = new Date(b.booking_time);
    timeStr = t.getHours().toString().padStart(2,'0') + ":" + t.getMinutes().toString().padStart(2,'0');
  } else {
    timeStr = String(b.booking_time).substring(0, 5);
  }
  document.getElementById("edit_booking_time").value = timeStr;
  document.getElementById("edit_vehicle_type").value = b.vehicle_type || "ไม่ระบุ";
  document.getElementById("edit_passenger_count").value = b.passenger_count || "";
  document.getElementById("edit_pickup_location").value = b.pickup_location || "";
  document.getElementById("edit_dropoff_location").value = b.dropoff_location || "";
  document.getElementById("edit_remark").value = b.remark || "";
  document.getElementById("edit_contact_mobile").value = b.contact_mobile || "";
  document.getElementById("edit_duration").value = String(b.duration || "1");

  // destroy flatpickr ถ้ามีค้างอยู่ (ไม่ใช้วันที่ใน series edit)
  if (fpEditInstance) { fpEditInstance.destroy(); fpEditInstance = null; }

  document.getElementById("editModal").style.display = "flex";
}

function closeEditModal() {
  document.getElementById("editModal").style.display = "none";
  currentEditBooking = null;
  currentEditBatchId = null;
  if (fpEditInstance) { fpEditInstance.destroy(); fpEditInstance = null; }
}

// [MODIFIED] submitEdit — รองรับทั้ง single (update_booking) และ series (update_series)
async function submitEdit() {
  const newTime = document.getElementById("edit_booking_time").value;
  if (!newTime) { alert("กรุณาระบุเวลา"); return; }

  // กรณี single booking ต้องมีวันที่
  if (currentEditBatchId === null) {
    const newDate = document.getElementById("edit_booking_date").value;
    if (!newDate) { alert("กรุณาระบุวันที่"); return; }
  }

  const isSeries = (currentEditBatchId !== null);
  const idToSend = isSeries ? currentEditBatchId : currentEditBooking.booking_id;
  const actionToSend = isSeries ? "update_series" : "update_booking";
  const bodyKey = isSeries ? "batch_id" : "booking_id";

  closeEditModal();
  toggleLoad(true);

  try {
    const payload = {
      action: actionToSend,
      [bodyKey]: idToSend,
      booking_time: newTime,
      vehicle_type: document.getElementById("edit_vehicle_type").value,
      passenger_count: document.getElementById("edit_passenger_count").value,
      pickup_location: document.getElementById("edit_pickup_location").value,
      dropoff_location: document.getElementById("edit_dropoff_location").value,
      remark: document.getElementById("edit_remark").value,
      duration: document.getElementById("edit_duration").value,
      contact_mobile: document.getElementById("edit_contact_mobile").value
    };
    // เพิ่ม booking_date เฉพาะกรณีงานเดี่ยว
    if (!isSeries) {
      payload.booking_date = document.getElementById("edit_booking_date").value;
    }

    await gasPost(payload);
    alert("✅ แก้ไขข้อมูลเรียบร้อย");
    await showHistory();
  } catch(err) {
    alert("เกิดข้อผิดพลาด: " + err.message);
    toggleLoad(false);
  }
}

async function submitBooking() {
  // [MODIFIED] Use Flatpickr dates
  const selectedDates = fpInstance.selectedDates;
  if (selectedDates.length === 0) { alert("กรุณาระบุวันที่"); return; }
  
  // [ADDED] ตรวจสอบว่าวันที่ทั้งหมดอยู่ในเดือนเดียวกัน (สำหรับ Series mode)
  if (isSeriesMode && selectedDates.length > 1) {
    const firstMonth = selectedDates[0].getMonth();
    const firstYear = selectedDates[0].getFullYear();
    const allSameMonth = selectedDates.every(d => 
      d.getMonth() === firstMonth && d.getFullYear() === firstYear
    );
    if (!allSameMonth) {
      alert("⚠️ งานเป็นชุด (Series) ต้องอยู่ในเดือนเดียวกันเท่านั้น\nกรุณาเลือกวันที่ใหม่");
      return;
    }
  }
  
  const bTime = document.getElementById("booking_time").value;
  if(!bTime) { alert("กรุณาระบุเวลา"); return; }

  toggleLoad(true);
  let actionType = "create_booking";
  if (role === "admin") actionType = "admin_create_booking";
  else if (role === "driver") actionType = "driver_create_booking";
  
  // Create Batch ID if multiple dates
  const batchId = (selectedDates.length > 1) ? (userId + "_" + Date.now()) : "";

  // [MODIFIED] Loop through all selected dates
  for (let d of selectedDates) {
      // Format date manually to YYYY-MM-DD because d is a JS Date object
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      const dateStr = `${year}-${month}-${day}`;

      await gasPost({ 
        action: actionType, 
        line_user_id: userId, 
        display_name: displayName, 
        booking_date: dateStr, // Use loop date
        booking_time: bTime, 
        vehicle_type: document.getElementById("vehicle_type").value, 
        passenger_count: document.getElementById("passenger_count").value, 
        pickup_location: document.getElementById("pickup_location").value, 
        dropoff_location: document.getElementById("dropoff_location").value, 
        remark: document.getElementById("remark").value,
        duration: document.getElementById("duration").value,
        contact_mobile: document.getElementById("contact_mobile").value,
        assign_driver_id: document.getElementById("assign_driver_id").value,
        batch_id: batchId // Send batch_id
      });
  }

  // After loop finishes
  document.getElementById("formBox").style.display = "none"; 
  // Reset form
  document.getElementById("remark").value = "";
  document.getElementById("pickup_location").value = "";
  document.getElementById("dropoff_location").value = "";
  fpInstance.clear();
  
  await showHistory(); 
  toggleLoad(false);
}
